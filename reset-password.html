<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportune — Reset Password</title>
  <link rel="stylesheet" href="opportune.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>

<body>

  <nav>
    <div class="logo">
      <a href="opportune.html">Oppor<span>tune</span></a>
    </div>
    <div class="nav-actions">
      <button class="btn-nav" onclick="window.location.href='login.html'">Login</button>
    </div>
  </nav>

  <section id="login">

    <div class="glow-gold"></div>
    <div class="glow-green"></div>

    <div class="register-container">

      <div class="register-header">
        <span class="badge">🔑 New password</span>
        <h1>Choose a new <span>password</span></h1>
        <p>Make sure it's something you'll remember</p>
      </div>

      <div class="register-form">

        <div id="resetMessage" style="display:none; margin-bottom: 16px; text-align:center;"></div>

        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword">
        </div>

        <button class="btn-primary btn-full" id="resetBtn" type="button">
          Reset password ⚡
        </button>

      </div>

    </div>

  </section>

  <script src="reset-password.js"></script>

</body>
</html>
