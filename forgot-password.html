<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportune — Forgot Password</title>
  <link rel="stylesheet" href="opportune.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>

<body>

  <nav>
    <div class="logo">
      <a href="opportune.html">Oppor<span>tune</span></a>
    </div>
    <ul class="nav-links">
      <li><a href="opportune.html#features">Features</a></li>
      <li><a href="opportune.html#how">How it works</a></li>
      <li><a href="opportune.html#regions">Regions</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-nav" onclick="window.location.href='login.html'">Login</button>
    </div>
  </nav>

  <section id="login">

    <div class="glow-gold"></div>
    <div class="glow-green"></div>

    <div class="register-container">

      <div class="register-header">
        <span class="badge">🔑 Password reset</span>
        <h1>Forgot your <span>password</span>?</h1>
        <p>Enter your email and we'll send you a reset link</p>
      </div>

      <div class="register-form">

        <div id="forgotMessage" style="display:none; margin-bottom: 16px; text-align:center;"></div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>

        <button class="btn-primary btn-full" id="forgotBtn" type="button">
          Send reset link ⚡
        </button>

        <p class="login-link">
          Remembered your password?
          <a href="login.html">Login here</a>
        </p>

      </div>

    </div>

  </section>

  <script src="forgot-password.js"></script>

</body>
</html>
