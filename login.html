<!-- Déclaration HTML5 -->
<!-- إعلان HTML5 -->
<!DOCTYPE html>

<!-- Langue anglaise, sens gauche à droite -->
<!-- اللغة الإنجليزية، الاتجاه من اليسار لليمين -->
<html lang="en" dir="ltr" data-theme="dark">

<head>

  <!-- Encodage des caractères -->
  <!-- ترميز الأحرف -->
  <meta charset="UTF-8">

  <!-- Adaptation aux écrans mobiles -->
  <!-- التكيف مع شاشات الهاتف -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Titre de la page -->
  <!-- عنوان الصفحة -->
  <title>Opportune — Login</title>

  <!-- Lien vers la feuille de style -->
  <!-- رابط ملف التصميم -->
  <link rel="stylesheet" href="opportune.css">

  <!-- Bibliothèque des drapeaux -->
  <!-- مكتبة الأعلام -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">

  <!-- Polices Google -->
  <!-- خطوط Google -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">

</head>

<body>

  <!-- Barre de navigation -->
  <!-- شريط التنقل -->
  <nav>

    <!-- Logo -->
    <!-- الشعار -->
    <div class="logo">
      <a href="opportune.html">Oppor<span>tune</span></a>
    </div>

    <!-- Liens de navigation -->
    <!-- روابط التنقل -->
    <ul class="nav-links">
      <li><a href="opportune.html#features">Features</a></li>
      <li><a href="opportune.html#how">How it works</a></li>
      <li><a href="opportune.html#regions">Regions</a></li>
    </ul>

    <!-- Actions -->
    <!-- الإجراءات -->
    <div class="nav-actions">

      <!-- Sélecteur de langue -->
      <!-- مبدل اللغة -->
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="ar">Ar</button>
        <button class="lang-btn" data-lang="fr">Fr</button>
        <button class="lang-btn active" data-lang="en">En</button>
      </div>

      <!-- Bouton inscription -->
      <!-- زر التسجيل -->
      <button class="btn-nav" onclick="window.location.href='register.html'">Sign Up</button>

    </div>

  </nav>

  <!-- Section login -->
  <!-- قسم الدخول -->
  <section id="login">

    <!-- Effets lumineux -->
    <!-- تأثيرات التوهج -->
    <div class="glow-gold"></div>
    <div class="glow-green"></div>

    <!-- Conteneur du formulaire -->
    <!-- حاوية النموذج -->
    <div class="register-container">

      <!-- En-tête -->
      <!-- الرأس -->
      <div class="register-header">
        <span class="badge">👋 Welcome back</span>
        <h1>Login to your <span>account</span></h1>
        <p>Enter your credentials to continue</p>
      </div>

      <!-- Formulaire -->
      <!-- النموذج -->
      <div class="register-form">

        <!-- Email -->
        <!-- البريد الإلكتروني -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>

        <!-- Mot de passe -->
        <!-- كلمة المرور -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password">
        </div>

        <!-- Mot de passe oublié -->
        <!-- نسيت كلمة المرور -->
        <div class="forgot-password">
          <a href="forgot-password.html">Forgot your password?</a>
        </div>

        <!-- Bouton connexion -->
        <!-- زر الدخول -->
        <button class="btn-primary btn-full" id="loginBtn" type="button">
          Login ⚡
        </button>

        <!-- Lien inscription -->
        <!-- رابط التسجيل -->
        <p class="login-link">
          Don't have an account?
          <a href="register.html">Sign up here</a>
        </p>

      </div>

    </div>

  </section>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
